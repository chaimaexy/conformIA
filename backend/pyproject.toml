[project]
name = "conformia-backend"
version = "0.1.0"
description = "ConformIA - copilote RAG de conformité IA (AI Act, RGPD, CNIL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "langchain-core>=0.3",
    "langchain-mistralai>=0.2",
    "supabase>=2.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pdfplumber>=0.11",
    "langchain-text-splitters>=0.3",
    "numpy>=2.0",
    "snowballstemmer>=2.2",            # racinisation française pour BM25 (pur Python)
    "langgraph>=1.2,<2",                # agent d'analyse : graphe fixe, pause et reprise
    "langgraph-checkpoint-sqlite>=3.1,<4",  # état des analyses sans base (poste de développement)
    "celery>=5.4,<6",                   # file des analyses : une à la fois (2 requêtes/min)
    "redis>=5,<7",
    "python-multipart>=0.0.18",         # envoi du PDF du projet (formulaire multipart)
    "langgraph-checkpoint-postgres>=3.2,<4",  # état des analyses dans Postgres (Supabase)
    "psycopg[binary,pool]>=3.2",        # connexion Postgres (analyses, conversations, LangGraph)
    "pyjwt[crypto]>=2.10",              # vérification des jetons Supabase Auth (ES256, JWKS)
    # 1.13.1 : DLL bloquée par le contrôle des applications de Windows sur le poste de dev
    "ormsgpack==1.12.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Encodeurs locaux (bge-m3, cross-encodeurs) : torch CPU + sentence-transformers.
# Sous Windows/Linux sans GPU : pip install torch --index-url https://download.pytorch.org/whl/cpu
local = [
    "sentence-transformers>=3.3",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "fakeredis>=2.26",  # tests de la file Redis sans serveur
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # extraits HTML du Journal officiel

[tool.pytest.ini_options]
testpaths = ["tests"]
