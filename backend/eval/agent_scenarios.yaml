  attendu:
    niveau: haut_risque
    annexe_iii: 4 a)
    obligations: {obligations_fournisseur: 2027-12-02, gestion_risques: 2027-12-02, donnees: 2027-12-02, documentation_technique: 2027-12-02, controle_humain: 2027-12-02, evaluation_conformite: null, enregistrement_fournisseur: null, incidents_graves: null}
    absentes: [obligations_deployeur, interdiction]

