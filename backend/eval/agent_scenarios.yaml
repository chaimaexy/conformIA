# Scénarios d'évaluation de l'agent d'analyse (phase 6).
#
# Chaque scénario : une description libre (ce que l'utilisateur écrit), les « faits » du projet
# (réponses qu'il donnerait aux questions fermées, utilisées pour répondre à sa place et pour
# repérer les valeurs du profil mal extraites), et le résultat attendu, vérifié contre le texte :
# article 5 (interdictions), annexe III (haut risque), article 50 (transparence), chapitre V
# (modèles à usage général), articles 113 et 111 (dates), carte des obligations.
#   niveau : interdit | haut_risque | haut_risque_a_confirmer | obligations_specifiques | risque_minimal
#   obligations : identifiants de la carte qui doivent figurer, avec leur date si elle est connue
#   absentes : identifiants qui ne doivent pas figurer

- id: cv_deployeur
  description: >-
    Nous sommes une PME française de 200 salariés. Nous voulons utiliser un logiciel du marché,
    acheté à un éditeur, qui analyse automatiquement les CV reçus et classe les candidats pour nos
    recrutements. Les recruteurs ne lisent que les 20 premiers candidats du classement.
  faits: {roles: [deployeur], decisions_sur_personnes: oui, interagit_avec_personnes: non, genere_contenus: non, biometrie: non, composant_securite_produit: non, modele_usage_general: non, secteur_public: non, lieu_de_travail: non, donnees_personnelles: oui, donnees_sensibles: non, deja_sur_le_marche: non}
  attendu:
    niveau: haut_risque
    annexe_iii: 4 a)
    obligations: {maitrise_ia: 2025-02-02, obligations_deployeur: 2027-12-02, information_personnes: 2027-12-02, droit_explication: null}
    absentes: [obligations_fournisseur, analyse_impact_droits, interdiction]

