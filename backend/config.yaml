# Configuration non sensible de ConformIA.
# Les secrets (clés API, URL Supabase) vont dans .env, jamais ici.

llm:
  provider: mistral
  # Offre gratuite (« Experiment »), limites relevées le 12/11/2026 dans les en-têtes de l'API
  # (mistral-large en est retiré le 13/11/2026 ; ministral-3b, 14b et open-mistral-nemo restent) :
  # ministral-8b / 14b : 2 requêtes et 40 000 tokens par minute ; mistral-large : 50 requêtes
  # et 20 000 tokens par minute ; mistral-small / medium : non accessibles (limite à 0).
  # Génération : ministral-8b, le meilleur modèle mesuré parmi ceux de l'offre gratuite.
  # mistral-large faisait mieux (2 réponses incorrectes sur 100 contre 14, phase 5 bis) mais
  # n'est plus accessible en offre gratuite depuis le 13/11/2026 (erreur 403 « tier_not_allowed »).
  chat_model: ministral-8b-latest
  judge_model: mistral-large-latest     # juge de l'évaluation (offre payante désormais ; résultats en cache)
  temperature: 0.0                      # réponses juridiques : déterministe
  max_tokens: 1024
  max_tokens_by_model:
    mistral-large-latest: 16000         # modèle qui raisonne : jusqu'à ~5 000 tokens de « thinking » avant la réponse
  rate_limits:
    ministral-8b-latest: {rpm: 2, tpm: 40000}
    ministral-14b-latest: {rpm: 2, tpm: 40000}
    mistral-large-latest: {rpm: 50, tpm: 20000}
  reasoning_effort:                     # réponses, routeur et contrôle de couverture (pas le juge)
    mistral-large-latest: low           # aussi juste que l'effort par défaut, 2 à 3 fois plus rapide

# Génération : seul un LLM génératif peut rédiger la réponse (un BERT ne génère pas de texte).
# Offre gratuite : 1 appel LLM par question (2 en zone grise), cache + retry, et
# évaluation du retrieval sans LLM (recall@k, MRR).

embeddings:
  provider: mistral
  model: mistral-embed
  dimension: 1024                       # doit correspondre à vector(1024) dans la migration SQL
  # Comparaison en phase 2 avec un encodeur de la famille BERT, local (CPU) et multilingue :
  # BAAI/bge-m3 (XLM-RoBERTa, MIT, 1024 dims -> même schéma SQL).
  # bge-m3 (local, CPU) comparé en phases 2 à 4 : utile sans reranker, inutile avec Cohere
  # (même hit@1 et MRR, phase 4 bis). Retiré : image Docker sans torch, réindexation en 1 min.
  compare_with: []

reranker:
  # Relit les 50 candidats fusionnés ; son score sert aussi de garde-fou « je ne sais pas ».
  # Choix phase 4 (README) : meilleure qualité, < 1 s par question, seul score qui sépare les
  # questions hors corpus. Repli local sans clé : BAAI/bge-reranker-v2-m3 (sans garde-fou fiable).
  model: cohere:rerank-v5.0-pro
  candidates:                           # comparés sur le golden set en phase 4
    - cohere:rerank-v5.0-fast                             # API (clé d'essai gratuite, non commerciale)
    - cohere:rerank-v5.0-pro
    - jina:jina-reranker-v3                               # API (phase 4 ter) : même classement, garde-fou faible
    - tomaarsen/Qwen3-Reranker-0.6B-seq-cls               # Qwen3, Apache-2.0, 0,6B
    - BAAI/bge-reranker-v2-m3                             # XLM-RoBERTa, Apache-2.0, 568M
    - antoinelouis/crossencoder-camembert-base-mmarcoFR   # CamemBERT français, MIT, 110M
  # Garde-fou à 3 zones, sur le score du 1er chunk (Cohere pro, 50 candidats, 125 questions) :
  #   score < 0,20         -> « je ne sais pas » (19 hors corpus sur 23 bloquées, 0 refus à tort)
  #   0,20 <= score < 0,45 -> zone grise : le LLM vérifie que les sources répondent (phase 5)
  #                           (4 questions du corpus, dont 3 à renvoi, et 4 hors corpus « limites »)
  #   score >= 0,45        -> réponse
  # Hors corpus max 0,297 / corpus min 0,299 : un seuil unique n'aurait aucune marge.
  # Valable pour ce modèle seulement : à recalibrer si le reranker change.
  answerability_threshold: 0.20
  verification_threshold: 0.45

chunking:
  strategy: structural                  # structural | recursive | semantic (comparées en phase 3)
  chunk_size: 1000                      # récursif : taille cible (caractères)
  chunk_overlap: 150                    # récursif : chevauchement
  max_chars: 2000                       # structurel + sémantique : taille maximale
  min_chars: 300                        # sémantique : fusion des fragments plus courts
  semantic_percentile: 90               # sémantique : coupe aux 10 % de transitions les plus « éloignées »
  article_references: false             # Renvois aussi pour les articles cités (mesuré en phase 4 bis)

retrieval:
  # Configuration retenue en phases 4 et 4 bis (hybride + reranker), voir le README.
  dense_models: [mistral-embed]         # recherche dense (pgvector HNSW) ; bge-m3 retiré (voir plus haut)
  bm25: true                            # + BM25 (racines françaises), fusionnés par RRF
  candidates: 50                        # résultats de chaque retriever avant fusion
  rrf_k: 60                             # constante de Reciprocal Rank Fusion
  multi_query: false                    # mesuré en phase 4 : fait baisser hit@1, brouille le garde-fou
  rerank_candidates: 50                 # candidats fusionnés relus par le reranker (20 -> 50 : MRR 0,837 -> 0,859)
  final_k: 4                            # chunks envoyés au LLM
  parent_max_chars: 4000                # partie d'un article découpé : section entière jusqu'à 4 000 car., sinon parties voisines

# Versions figées pour la reproductibilité. L'ingestion interroge Cellar et prévient
# si une version consolidée plus récente ou un nouveau rectificatif français existe.
corpus:
  language: fr
  sources:
    - id: ai_act
      title: "Règlement (UE) 2024/1689 - AI Act (modifié par le règlement (UE) 2026/1744)"
      celex: "32024R1689"
      consolidated: "02024R1689-20260727"   # intègre l'omnibus numérique (UE) 2026/1744
      corrigenda: ["32024R1689R(01)"]       # art. 10 ; R(02)-(04) ne concernent pas le français
    - id: rgpd
      title: "Règlement (UE) 2016/679 - RGPD"
      celex: "32016R0679"
      consolidated: "02016R0679-20160504"
      corrigenda: ["32016R0679R(02)"]       # JO L 127 du 23.5.2018 : considérants 71, 134, 143 + articles
    - id: cnil_ia
      kind: cnil
      title: "CNIL - Fiches pratiques IA (développement des systèmes d'IA et RGPD)"
      url: "https://www.cnil.fr/fr/les-fiches-pratiques-ia"   # licence CC-BY-ND 4.0
